<!doctype html>
<html lang="it" class="h-full bg-slate-950 text-slate-100 antialiased select-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover" />
    <title>MyFinance Pro - Android Edition</title>
    <meta name="description" content="App di finanza personale mobile con tracciamento spese, conti, budget e supporto multilingue italiano, tedesco e inglese." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MyFinance Pro - Android Edition" />
    <meta property="og:description" content="App di finanza personale mobile con tracciamento spese, conti, budget e supporto multilingue italiano, tedesco e inglese." />
    <meta property="og:image" content="/myfinance-icon.jpg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyFinance Pro - Android Edition" />
    <meta name="twitter:description" content="App di finanza personale mobile con tracciamento spese, conti, budget e supporto multilingue italiano, tedesco e inglese." />
    <meta name="twitter:image" content="/myfinance-icon.jpg" />

    <!-- Copyright & Author -->
    <meta name="author" content="Federico Pontedoro" />
    <meta name="copyright" content="© 2026 Federico Pontedoro. All rights reserved. My Finance Pro · Android Mobile Edition." />

    <!-- Android & Mobile Web App Meta (Standalone Fullscreen) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyFinance" />
    <meta name="application-name" content="MyFinance" />
    <meta name="msapplication-starturl" content="/" />
    <meta name="theme-color" content="#020617" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Native Android & iOS Official Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/pwa-192x192.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Chunk error recovery -->
    <script>
      window.addEventListener('error', function(e) {
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var retryKey = 'chunk_reload_retry_' + (new Date().toISOString().split('T')[0]);
          if (!sessionStorage.getItem(retryKey)) {
            sessionStorage.setItem(retryKey, 'true');
            window.location.reload();
          }
        }
      }, true);
    </script>
  </head>
  <body class="h-full bg-slate-950 text-slate-100 overflow-x-hidden selection:bg-indigo-500/30 selection:text-white">
    <div id="root">
      <div id="app-boot-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; padding: 24px; text-align: center;">
        <img src="/pwa-192x192.png" alt="MyFinance" onerror="this.src='/icon.svg'" style="width: 72px; height: 72px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4); margin-bottom: 20px;" />
        <h1 style="font-size: 20px; font-weight: 800; margin: 0 0 6px 0; letter-spacing: -0.02em; background: linear-gradient(to right, #ffffff, #c7d2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">MyFinance Pro</h1>
        <p style="font-size: 13px; color: #94a3b8; margin: 0 0 24px 0;">Android Mobile Edition</p>
        <div style="width: 32px; height: 32px; border: 3px solid rgba(99, 102, 241, 0.2); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
        
        <div id="app-boot-troubleshoot" style="display: none; margin-top: 32px; padding: 16px; background: rgba(30, 41, 59, 0.5); border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); max-width: 340px;">
          <p id="boot-status-text" style="font-size: 12px; color: #cbd5e1; margin: 0 0 12px 0;">Il caricamento richiede più tempo del previsto.</p>
          <div style="display: flex; gap: 8px; justify-content: center;">
            <button onclick="window.location.reload(true)" style="background: #4f46e5; color: white; border: none; border-radius: 10px; padding: 10px 16px; font-size: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);">Ricarica</button>
            <a href="/myfinance_standalone.html" style="display: inline-block; background: #0284c7; color: white; border: none; border-radius: 10px; padding: 10px 16px; font-size: 12px; font-weight: bold; text-decoration: none;">Versione Offline</a>
          </div>
        </div>
        <script>
          if (window.location.protocol === 'file:') {
            var tb = document.getElementById('app-boot-troubleshoot');
            if (tb) {
              tb.style.display = 'block';
              var txt = document.getElementById('boot-status-text');
              if (txt) {
                txt.innerHTML = '<strong style="color: #f87171;">Apertura diretta file://</strong><br>I moduli JS richiedono un server locale (npm run dev) o l\'applicazione autonoma bundle:';
              }
            }
          } else {
            setTimeout(function() {
              var el = document.getElementById('app-boot-troubleshoot');
              if (el) el.style.display = 'block';
            }, 4000);
          }
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
