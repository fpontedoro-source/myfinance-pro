<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base background (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- Back Card -->
  <rect x="110" y="140" width="280" height="170" rx="20" fill="url(#cardGrad)" opacity="0.75" transform="rotate(-6 250 225)" filter="url(#shadow)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Front Card (Wallet/Card) -->
  <g filter="url(#shadow)">
    <rect x="116" y="170" width="280" height="175" rx="22" fill="#0f172a" stroke="rgba(129, 140, 248, 0.4)" stroke-width="3"/>
    
    <!-- Chip -->
    <rect x="146" y="205" width="42" height="32" rx="6" fill="url(#goldGrad)"/>
    <line x1="146" y1="221" x2="188" y2="221" stroke="#b45309" stroke-width="1.5"/>
    <line x1="167" y1="205" x2="167" y2="237" stroke="#b45309" stroke-width="1.5"/>

    <!-- Contactless wave -->
    <path d="M 210 212 A 10 10 0 0 1 210 230" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 218 206 A 18 18 0 0 1 218 236" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Card Brand Text -->
    <text x="146" y="318" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" letter-spacing="1.5">MYFINANCE</text>
    <text x="350" y="318" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16">PRO</text>
  </g>

  <!-- Front Growth Badge / Euro Coin -->
  <g filter="url(#shadow)">
    <circle cx="340" cy="330" r="54" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4"/>
    <text x="340" y="348" text-anchor="middle" fill="#78350f" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="46">€</text>
  </g>

  <!-- Upward Trend Arrow -->
  <g filter="url(#shadow)">
    <circle cx="160" cy="370" r="32" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
    <path d="M 150 376 L 160 362 L 170 376 M 160 362 L 160 380" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
